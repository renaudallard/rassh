name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: 30.0.16248370
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              "platforms;android-37.0" "build-tools;36.0.0" "ndk;$NDK_VERSION"

      # The SFTP tests talk to OpenSSH's sftp-server.
      - name: Install sftp-server
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends openssh-sftp-server

      - name: Build OpenSSH and LibreSSL
        run: ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION" native/build.sh

      - name: Test and build
        run: ./gradlew --no-daemon :core:test :app:lintDebug :app:assembleDebug

      # The signing secrets are only visible to this step.
      - name: Build release
        env:
          RASSH_KEYSTORE: ${{ secrets.RASSH_KEYSTORE }}
          RASSH_KEYSTORE_PASSWORD: ${{ secrets.RASSH_KEYSTORE_PASSWORD }}
          RASSH_KEY_ALIAS: ${{ secrets.RASSH_KEY_ALIAS }}
          RASSH_KEY_PASSWORD: ${{ secrets.RASSH_KEY_PASSWORD }}
        run: |
          if [ -n "$RASSH_KEYSTORE" ]; then
              echo "$RASSH_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
              export RASSH_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          fi
          ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rassh
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk

      # Apart, as a shared path would move the APKs the release job copies.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rassh-bundle
          path: app/build/outputs/bundle/release/*.aab

  # Publish the signed APK when versionName has no release yet.
  # Forks have no signing key, and two pushes of a new version must not race.
  release:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renaudallard/rassh'
    concurrency:
      group: release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check version
        id: version
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)
          test -n "$version"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
              echo "new=false" >> "$GITHUB_OUTPUT"
          else
              echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: steps.version.outputs.new == 'true'
        with:
          name: rassh
          path: apk

      - name: Publish release
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          cp apk/release/app-release.apk "rassh-$TAG.apk"
          gh release create "$TAG" "rassh-$TAG.apk" --target "$GITHUB_SHA" \
              --title "rassh $TAG" --generate-notes
